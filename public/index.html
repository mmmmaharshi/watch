<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Movies & TV Shows Free</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
<meta name="description" content="Watch movies and TV shows for free. Paste an IMDB ID to stream instantly.">
<meta name="keywords" content="watch movies, free streaming, imdb, tv shows, online streaming">
<meta property="og:title" content="Watch Movies & TV Shows Free">
<meta property="og:description" content="Watch movies and TV shows for free. Paste an IMDB ID to stream instantly.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Consolas', monospace;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { display: flex; gap: 0; align-items: center; }
  input {
    padding: 1rem 1.25rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #222;
    border-right: none;
    border-radius: 6px 0 0 6px;
    background: #0a0a0a;
    color: #fff;
    outline: none;
    width: 280px;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #e50914; }
  input::placeholder { color: #444; }
  input.loading { border-color: #e50914; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { to { border-color: #555; } }
  button {
    padding: 1rem 1.5rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #e50914;
    border-radius: 0 6px 6px 0;
    background: #e50914;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #b0060f; }
  button:active { transform: scale(0.97); }
  button:disabled { background: #444; border-color: #444; cursor: wait; }
</style>
</head>
<body>
  <div class="wrap">
    <input type="text" id="imdb" placeholder="tt1300854" autocomplete="off" spellcheck="false">
    <button id="go">watch</button>
  </div>

<script>
const input = document.getElementById('imdb');
const btn = document.getElementById('go');

const params = new URLSearchParams(location.search);
if (params.get('id')) input.value = params.get('id');

async function go() {
  const id = input.value.trim().toLowerCase();
  if (!id.startsWith('tt')) {
    input.style.borderColor = '#e50914';
    setTimeout(() => input.style.borderColor = '#222', 1200);
    return;
  }
  history.pushState(null, '', `?id=${id}`);
  btn.disabled = true;
  input.classList.add('loading');
  try {
    const res = await fetch(`/api/watch?id=${encodeURIComponent(id)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
    const { url } = await res.json();
    window.open(url, '_blank');
  } catch (err) {
    input.style.borderColor = '#e50914';
    console.error(err.message);
  } finally {
    btn.disabled = false;
    input.classList.remove('loading');
  }
}

btn.addEventListener('click', go);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) go(); });
input.focus();
</script>
</body>
</html>
