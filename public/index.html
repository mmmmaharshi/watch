<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>watch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Consolas', monospace;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { display: flex; gap: 0; align-items: center; }
  select {
    padding: 1rem 0.75rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #222;
    border-right: none;
    border-radius: 6px 0 0 6px;
    background: #0a0a0a;
    color: #fff;
    outline: none;
    cursor: pointer;
  }
  input {
    padding: 1rem 1.25rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #222;
    border-right: none;
    border-radius: 6px 0 0 6px;
    background: #0a0a0a;
    color: #fff;
    outline: none;
    width: 280px;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #e50914; }
  input::placeholder { color: #444; }
  input[type=number] { width: 50px; padding: 1rem 0.5rem; text-align: center; border-right: none; }
  input.loading { border-color: #e50914; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { to { border-color: #555; } }
  button {
    padding: 1rem 1.5rem;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid #e50914;
    border-radius: 0 6px 6px 0;
    background: #e50914;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #b0060f; }
  button:active { transform: scale(0.97); }
  button:disabled { background: #444; border-color: #444; cursor: wait; }
</style>
</head>
<body>
  <div class="wrap">
    <select id="type">
      <option value="movie">movie</option>
      <option value="tv">tv</option>
    </select>
    <input type="text" id="imdb" placeholder="tt1300854" autocomplete="off" spellcheck="false">
    <input type="number" id="s" placeholder="S" min="1" style="display:none">
    <input type="number" id="e" placeholder="E" min="1" style="display:none">
    <button id="go">watch</button>
  </div>

<script>
const type = document.getElementById('type');
const input = document.getElementById('imdb');
const sIn = document.getElementById('s');
const eIn = document.getElementById('e');
const btn = document.getElementById('go');

type.addEventListener('change', () => {
  const tv = type.value === 'tv';
  sIn.style.display = tv ? 'block' : 'none';
  eIn.style.display = tv ? 'block' : 'none';
});

async function go() {
  const id = input.value.trim().toLowerCase();
  if (!id.startsWith('tt')) {
    input.style.borderColor = '#e50914';
    setTimeout(() => input.style.borderColor = '#222', 1200);
    return;
  }
  btn.disabled = true;
  input.classList.add('loading');
  try {
    const res = await fetch(`/api/watch?id=${encodeURIComponent(id)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
    const { url } = await res.json();
    const finalUrl = type.value === 'tv'
      ? url.replace('/embed/movie/', `/embed/tv/`).replace(`/${id}`, `/${id}/${sIn.value||1}/${eIn.value||1}`)
      : url;
    window.open(finalUrl, '_blank');
  } catch (err) {
    input.style.borderColor = '#e50914';
    console.error(err.message);
  } finally {
    btn.disabled = false;
    input.classList.remove('loading');
  }
}

btn.addEventListener('click', go);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) go(); });
input.focus();
</script>
</body>
</html>
