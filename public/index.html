<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
<meta name="description" content="Watch movies and TV shows. Paste an IMDB ID to stream.">
<style>
  :root {
    --canvas: #0A0A0A;
    --ink: #FFFFFF;
    --ink-secondary: rgb(255 255 255 / 56%);
    --ink-tertiary: rgb(255 255 255 / 36%);
    --border: rgb(255 255 255 / 10%);
    --border-strong: rgb(255 255 255 / 18%);
    --fill-hover: rgb(255 255 255 / 9%);
    --fill-pressed: rgb(255 255 255 / 14%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Geist Pixel', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    background: var(--canvas);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  .header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .subtitle {
    color: var(--ink-secondary);
    margin-top: 8px;
  }

  .form-group {
    display: flex;
    align-items: stretch;
  }

  input {
    flex: 1;
    padding: 16px 20px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 400;
    border: 1px solid var(--border-strong);
    border-radius: 8px 0 0 8px;
    background: var(--canvas);
    color: var(--ink);
    outline: none;
    min-width: 0;
    transition: border-color 0.15s ease;
  }

  input::placeholder {
    color: var(--ink-tertiary);
  }

  input:focus {
    border-color: var(--ink);
  }

  input.loading {
    border-color: var(--ink);
    animation: pulse 0.8s infinite alternate;
  }

  @keyframes pulse {
    to { border-color: var(--border-strong); }
  }

  button {
    padding: 16px 24px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--ink);
    border-radius: 0 8px 8px 0;
    background: var(--ink);
    color: var(--canvas);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 120px;
  }

  button:hover {
    background: var(--ink-secondary);
    border-color: var(--ink-secondary);
  }

  button:active {
    transform: scale(0.98);
  }

  button:disabled {
    background: var(--ink-tertiary);
    border-color: var(--ink-tertiary);
    cursor: wait;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--canvas);
    border-top-color: transparent;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  button.loading .spinner {
    opacity: 1;
    animation: spin 0.7s linear infinite;
  }

  button.loading .btn-text {
    opacity: 0.7;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status {
    margin-top: 16px;
    font-size: 0.875rem;
    min-height: 1.5rem;
    transition: opacity 0.2s ease;
  }

  .status.loading {
    color: var(--ink-tertiary);
  }

  .status.error {
    color: var(--ink-secondary);
  }

  .help {
    margin-top: 8px;
    color: var(--ink-tertiary);
    font-size: 0.875rem;
  }

  .help a {
    color: var(--ink-secondary);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .help a:hover {
    color: var(--ink);
  }

  @media (max-width: 480px) {
    .container {
      max-width: 100%;
    }

    .header {
      margin-bottom: 32px;
    }

    .form-group {
      flex-direction: column;
      gap: 8px;
    }

    input {
      border-radius: 8px;
      border-right: 1px solid var(--border-strong);
    }

    button {
      border-radius: 8px;
    }
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgb(0 0 0 / 64%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--canvas);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }

  .modal h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .modal .meta {
    color: var(--ink-secondary);
    font-size: 0.875rem;
    margin-bottom: 24px;
  }

  .modal .detail {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }

  .modal .detail:first-of-type {
    border-top: none;
  }

  .modal .detail-label {
    color: var(--ink-tertiary);
    font-size: 0.875rem;
  }

  .modal .detail-value {
    font-size: 0.875rem;
    text-align: right;
    word-break: break-all;
    max-width: 60%;
  }

  .modal .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .modal .btn-secondary {
    flex: 1;
    padding: 12px 20px;
    font-size: 0.875rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: fit-content;
  }

  .modal .btn-secondary.icon {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    padding: 0;
  }

  .modal .btn-primary {
    flex: 1;
    padding: 12px 20px;
    font-size: 0.875rem;
    font-family: inherit;
    font-weight: 500;
    border: 1px solid var(--ink);
    border-radius: 8px;
    background: var(--ink);
    color: var(--canvas);
    cursor: pointer;
    transition: background 0.15s ease;
    min-width: fit-content;
  }

  .modal .btn-secondary:hover {
    background: var(--fill-hover);
  }

  .modal .btn-primary:hover {
    background: var(--ink-secondary);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Watch</h1>
      <p class="subtitle">Movies and TV shows, instantly.</p>
    </header>

    <form class="form-group" id="form">
      <input type="text" id="imdb" placeholder="tt1300854" autocomplete="off" spellcheck="false" aria-label="IMDB ID">
      <button type="submit" id="go">
        <span class="spinner"></span>
        <span class="btn-text">Watch now</span>
      </button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="help">Enter an IMDB ID, e.g. <a href="?id=tt1300854">tt1300854</a></p>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Stream Found</h2>
      <p class="meta" id="modal-meta"></p>
      <div class="detail">
        <span class="detail-label">Type</span>
        <span class="detail-value" id="modal-type"></span>
      </div>
      <div class="detail">
        <span class="detail-label">Provider</span>
        <span class="detail-value" id="modal-provider"></span>
      </div>
      <div class="detail">
        <span class="detail-label">Stream URL</span>
        <span class="detail-value" id="modal-url"></span>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn-secondary icon" id="modal-try-another" title="Get another stream link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
        </button>
        <button class="btn-primary" id="modal-watch">Watch</button>
      </div>
    </div>
  </div>

<script>
const form = document.getElementById('form');
const input = document.getElementById('imdb');
const btn = document.getElementById('go');
const status = document.getElementById('status');
const modal = document.getElementById('modal');
const modalMeta = document.getElementById('modal-meta');
const modalType = document.getElementById('modal-type');
const modalProvider = document.getElementById('modal-provider');
const modalUrl = document.getElementById('modal-url');
const modalCancel = document.getElementById('modal-cancel');
const modalTryAnother = document.getElementById('modal-try-another');
const modalWatch = document.getElementById('modal-watch');

const params = new URLSearchParams(location.search);
if (params.get('id')) input.value = params.get('id');

let pendingStreamUrl = null;
let currentProvider = null;
let currentId = null;

function setStatus(text, type) {
  status.textContent = text;
  status.className = type ? `status ${type}` : 'status';
}

function setLoading(loading) {
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
  input.classList.toggle('loading', loading);
  if (loading) input.blur();
}

function showModal(data) {
  pendingStreamUrl = data.url;
  currentProvider = data.provider;
  currentId = data.id;
  modalMeta.textContent = data.name || data.id.toUpperCase();
  modalType.textContent = data.type === 'tv' ? 'TV Show' : 'Movie';
  modalProvider.textContent = data.provider;
  modalUrl.textContent = data.url;
  modal.classList.add('active');
}

function hideModal() {
  modal.classList.remove('active');
  pendingStreamUrl = null;
  currentProvider = null;
  currentId = null;
}

modalCancel.addEventListener('click', hideModal);
modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });
modalWatch.addEventListener('click', () => {
  if (pendingStreamUrl) window.open(pendingStreamUrl, '_blank');
  hideModal();
  setStatus('', '');
});

modalTryAnother.addEventListener('click', async () => {
  if (!currentId) return;
  setStatus('Finding another stream...', 'loading');
  try {
    const res = await fetch(`/api/watch?id=${encodeURIComponent(currentId)}&exclude=${encodeURIComponent(currentProvider)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
    const data = await res.json();
    showModal({ ...data, id: currentId });
    setStatus('', '');
  } catch (err) {
    setStatus(err.message || 'No other providers available.', 'error');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('active')) hideModal();
});

async function go() {
  const id = input.value.trim().toLowerCase();
  if (!id.startsWith('tt')) {
    setStatus('Please enter a valid IMDB ID starting with tt', 'error');
    input.style.borderColor = 'var(--ink)';
    setTimeout(() => {
      input.style.borderColor = '';
      setStatus('', '');
    }, 2000);
    return;
  }

  history.pushState(null, '', `?id=${id}`);
  setLoading(true);
  setStatus('Finding a working stream...', 'loading');

  try {
    const res = await fetch(`/api/watch?id=${encodeURIComponent(id)}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
    const data = await res.json();
    setStatus('', '');
    showModal({ ...data, id });
  } catch (err) {
    setStatus(err.message || 'Something went wrong. Try again.', 'error');
    input.style.borderColor = 'var(--ink)';
    setTimeout(() => input.style.borderColor = '', 2000);
  } finally {
    setLoading(false);
  }
}

form.addEventListener('submit', e => { e.preventDefault(); go(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) go(); });
input.focus();
</script>
</body>
</html>
