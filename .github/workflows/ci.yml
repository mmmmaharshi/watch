name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Third-party providers make the live criteria slow and flaky, so they do not
  # block every pull request. Add the `run-live-qa` label to ask for one.
  pr-live:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-qa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-test-results
          path: test-results/
          retention-days: 7
