name: qa-live

# The live criteria talk to Cinemeta and the stream providers. A pull request
# must not wait on them, so they run here, against the deployed site.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:live
        env:
          LIVE_URL: https://watch.maharshi.work
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
