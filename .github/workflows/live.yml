name: live

# Grades the deployed site: real search, real provider lookups, desktop and
# phone. Runs nightly and can be started by hand after a deploy.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:live
        env:
          LIVE_URL: https://watch.maharshi.work
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-test-results
          path: test-results/
          retention-days: 7
